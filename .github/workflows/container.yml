name: Container build

on:
  pull_request:
    paths:
      - 'images/pulp-development/**'
      - 'images/pulp-source/**'
      - '.gitmodules'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref_name }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  container:
    name: ${{ matrix.container }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: pulp-development
            project: pulp-development
            pulpcore_version: "3.117.1"
          - container: pulp-source
            project: pulp-source
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Pin pulpcore version
        if: matrix.pulpcore_version != ''
        run: sed -i "s/^pulpcore$/pulpcore==${{ matrix.pulpcore_version }}/" images/pulp-development/requirements.txt
      - name: Build ${{ matrix.container }} container
        run: PROJECT=${{ matrix.project }} make build
